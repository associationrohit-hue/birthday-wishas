<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(to bottom, #ffe4ec, #fff0f6, #f3e8ff);
      overflow-x: hidden;
      color: #444;
    }

    .container {
      position: relative;
      z-index: 2;
    }

    /* Floating Hearts */
    .heart {
      position: absolute;
      color: rgba(255, 105, 180, 0.4);
      animation: float 6s infinite ease-in-out;
      font-size: 25px;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    /* Popup */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .popup-box {
      background: white;
      padding: 30px;
      border-radius: 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      animation: bounce 2s infinite;
      border: 4px solid #ffc1d6;
      position: relative;
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      border: none;
      background: none;
      font-size: 22px;
      cursor: pointer;
    }

    .popup h2 {
      color: #ff4f8b;
      margin: 15px 0;
      font-size: 2rem;
    }

    .popup button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 40px;
      background: #ff4f8b;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .popup button:hover {
      transform: scale(1.05);
      background: #ff2f74;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 120px 20px 80px;
      position: relative;
    }

    .hero-card {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      padding: 40px 25px;
      border-radius: 35px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 2px solid #ffd1e1;
    }

    .hero h1 {
      font-size: 4rem;
      color: #ff4f8b;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      line-height: 1.8;
    }

    .teddy {
      position: absolute;
      font-size: 80px;
      animation: teddyMove 3s infinite ease-in-out;
    }

    .teddy.left {
      left: 10px;
      top: 80px;
    }

    .teddy.right {
      right: 10px;
      bottom: 20px;
    }

    @keyframes teddyMove {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    /* Letter */
    .letter-section {
      padding: 60px 20px;
      display: flex;
      justify-content: center;
    }

    .letter {
      max-width: 700px;
      width: 100%;
      cursor: pointer;
    }

    .letter-top {
      height: 70px;
      background: #ff9cbc;
      border-radius: 30px 30px 0 0;
    }

    .letter-content {
      background: white;
      padding: 35px;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 4px solid #ffd3e2;
      transition: 0.5s;
    }

    .letter:hover .letter-content {
      transform: translateY(-10px);
    }

    .letter h2 {
      color: #ff4f8b;
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .letter p {
      line-height: 1.8;
      font-size: 1.1rem;
    }

    /* Polaroids */
    .gallery {
      padding: 70px 20px;
      text-align: center;
    }

    .gallery h2,
    .secret-section h2,
    .final-section h2 {
      font-size: 2.8rem;
      color: #ff4f8b;
      margin-bottom: 50px;
    }

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px,
